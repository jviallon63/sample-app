<mat-toolbar class="toolbar">
  <button mat-icon-button (click)="sidenav.toggle()" aria-label="Toggle menu">
    <mat-icon>menu</mat-icon>
  </button>
  <a routerLink="/" class="brand">{{ title }}</a>
  <span class="spacer"></span>
  <button mat-icon-button aria-label="Set theme" (click)="setTheme()">
    <mat-icon [fontIcon]="darkMode ? 'light_mode' : 'bedtime'"></mat-icon>
  </button>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav #sidenav mode="side" opened class="sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>Products</span>
      </a>
      <a mat-list-item routerLink="/categories" routerLinkActive="active">
        <mat-icon matListItemIcon>category</mat-icon>
        <span matListItemTitle>Categories</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content class="content">
    <main>
      <router-outlet></router-outlet>
    </main>
    <footer class="footer">
      <span>© {{ year }} {{ title }}</span>
      <span class="version">Version {{ version }}</span>
    </footer>
  </mat-sidenav-content>
</mat-sidenav-container>
