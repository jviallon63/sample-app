<h2 mat-dialog-title>{{ editMode ? 'Edit category' : 'Add new category' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form" (ngSubmit)="saveCategory()">
    <mat-form-field>
      <mat-label>Category Name</mat-label>
      <input matInput formControlName="categoryName" required />
      @if (form.get('categoryName')?.hasError('required') && form.get('categoryName')?.touched) {
        <mat-error>Name is required</mat-error>
      }
    </mat-form-field>
    <mat-form-field>
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="categoryDescription" rows="3"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button [disabled]="form.invalid || saving" (click)="saveCategory()">
    <mat-icon>save</mat-icon>
    Save
  </button>
</mat-dialog-actions>
