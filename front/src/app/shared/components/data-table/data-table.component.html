<div class="table-card">
  @if (loading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }
  <table mat-table [dataSource]="items()" matSort (matSortChange)="onSort($event)">
    @for (column of columns(); track column.key) {
      <ng-container [matColumnDef]="column.key">
        <th mat-header-cell *matHeaderCellDef mat-sort-header [disabled]="!column.sortable">{{ column.header }}</th>
        <td mat-cell *matCellDef="let item">{{ column.cell(item) }}</td>
      </ng-container>
    }

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="actions-cell"></th>
      <td mat-cell *matCellDef="let item" class="actions-cell">
        <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Row actions">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button type="button" mat-menu-item (click)="edit.emit(item)"><mat-icon>edit</mat-icon> Edit</button>
          <button type="button" mat-menu-item (click)="remove.emit(item)"><mat-icon>delete</mat-icon> Delete</button>
        </mat-menu>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>
  </table>

  @if (!loading() && !items().length) {
    <div class="empty-state">
      <mat-icon>inbox</mat-icon>
      <p>There is no element to display.</p>
    </div>
  }

  <mat-paginator
    [length]="total()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="pageSizeOptions()"
    (page)="onPage($event)"
    showFirstLastButtons
  ></mat-paginator>
</div>
