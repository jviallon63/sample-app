spring:
  application:
    name: openapi-workshop
  profiles:
    default: local
  cors:
    allowedOrigins: ${APP_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # SQL Initialization (scripts are defined per profile)
  sql:
    init:
      mode: always

# Configuration OpenAPI/Swagger
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true
    filter: true

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

# Logging
logging:
  level:
    com.workshop.openapi: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
